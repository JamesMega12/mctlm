ce conditions are found.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Remove the wheels. Without removing tire, examine each wheel rim (tractor and trailer) for cracks, bent components, pitting due to corrosion, or other structural damage. Replace if damaged or out-of-service defect is found. Note: If a wheel has single piece rim and must be replaced, refer to Tire Mounting and Demounting in Workshop (Single Piece Rim \u2013 Tubeless Tire Assembled by Hand) SWI, 7776193. Note: If a wheel has multi-piece rim, make sure that the application is approved from the Technology Center via InTouch or plan to change over to single-piece rim.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"If a wheel has multi-piece rims: Examine the lock rings and side rings for damage. Makes sure that the rings fit correctly. If any substandard or damaged components are identified, replace the wheel. Note: If a wheel has two-piece rim and must be replaced, refer to Tire Mounting and Demounting in Workshop (Two Piece Rim Tire \u2013Assembled by Hand) SWI, InTouch 7815584. Note: If a wheel has three-piece rim and must be replaced, refer to Tire Mounting and Demounting in Workshop (Three Piece Rim Tire Assembled by Hand) SWI, InTouch 7792195.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine the wheel bearing for unusual noises, excessive vibration, or excessive end play. Replace bearings as needed.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine the tires for dry rot, splitting, and under-inflation. Check the tire pressure, tread depth and condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine each tire (tractor and trailer) for out-of-service conditions (cracks, damage, sidewall blisters, cord separation). Note: If a wheel has single piece rim and must be replaced by SLB, refer to Tire Mounting and Demounting in Workshop (Single Piece Rim \u2013 Tubeless Tire Assembled by Hand) SWI, 7776193. If a wheel has multi-piece rim, make sure that the application is approved from the Technology Center via InTouch or plan to change over to single piece rim.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Check the tire tread depth (the steering axle tire has a minimum of 4/32 in; the other tires have a minimum of 2/32 in). Make sure that the tire stems are in good condition and have caps.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Make sure that all tires have the correct air pressure. Note: If tire inflation is required, refer to TLM: Tire inflation While Mounted on a Vehicle Standard Practice, SWI 7793024, or Tire Inflation While in Safety Cage SWI 7815576.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Make sure that the lug nuts and lug studs are in good condition. Replace stud bolts that are bent, broken, cracked, damaged, or if the tread is worn out. If two or more studs are broken, replace all the studs for that rim.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine all trailer connections for damage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine the axle housing for leaks.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine the 5th-wheel bushing for cracks and damage. Replace the bushing if worn. Lubricate as necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Make sure that the air bags and the valves are in position and in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Make sure that the shock absorber is installed correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine all axles for loose bolts. Examine the weld connections for cracks and damage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Grease all applicable chassis components.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Look through the dust shield inspection hole. Examine the stroke indication for wear. Make sure that the slacks do not stick.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"With tires removed, make sure that the shoes and the pads are in the correct position. Make sure that the brake lining has a minimum thickness of 1/4-in.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Examine the brake drums for cracks, deep grooves, run-out and out-of-round conditions. Make sure that the drum diameter is not more than the maximum allowable limit.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Measure the brake chamber stroke. Record the length. The maximum standard stroke is 50.8 mm (2 in). The maximum long stroke is 63.5 mm (2.5 in)","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Check the condition and lubricate each S-cam bushing and cam tube.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Examine the slack adjuster for loose connections of the pins, the bolts, the stripped rachets, and the seized pins.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Check the condition and lubricate each slack adjuster.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Examine the anchor pins for cracks. Make sure that the pins are not loose.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"If applicable: Examine the quick release valve and make sure that it operates correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Check the condition of the air brake control valve.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Examine the incoming air lines of each brake chamber for cracks, rubbing, damage, and leaks.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Do a test of the ABS lights. Make sure that the ABS blink codes are correct.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Check the condition and adjust the ABS sensors and the wiring. Make sure that the ABS sensors and the wiring are clean.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Drain all brake air tanks/reservoirs. Examine for moisture and oil. If you find oil, redress the air compressor. Check the condition of the drain valves.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Examine the hoses, the tubing, and the connections for leaks and wear.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":48,"n":"Build the parking brake air pressure and monitor the timing for a maximum of 5 minutes.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":49,"n":"Make sure that the work related to the OEM Maintenance schedules is completed for all the major components of the unit, refer to unit Maintenance & Vendor Manual for more details.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":49,"n":"Examine the condition of all cables, wirings, and connectors; tighten all connections. Note: Use your cellphone to scan this QR code to learn more about Cable Inspection awareness campaign. See InTouch 7563287 for more information.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":50,"n":"Do in-frame rebuild and major overhaul as required (based on engine running hrs, condition or HHP results).","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["376/377","SL3"],["573","SL4"],["573","SL3"],["870","SL4"],["870","SL3"],["577","SL3"],["577","SL4"]],"g":"SL1/3/4"},{"s":50,"n":"Do the OEM recommended engine maintenance (if applicable). Refer to Power Train, InTouch 4769766.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["376/377","SL3"],["573","SL4"],["573","SL3"],["870","SL4"],["870","SL3"],["577","SL3"],["577","SL4"]],"g":"SL1/3/4"},{"s":50,"n":"Do a check of the ECM harness. Pull - Open each of the connectors to examine for corrosion. Tighten all connections. Replace the desiccant packs in the ECM enclosure.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":50,"n":"Examine the condition of the wiring and the connectors for all the engine sensors. Make sure that they operate correctly and are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":50,"n":"Examine the engine starters and connections; make sure that the starter is in good condition, drive pinon is not damaged and the connections are corrosion free. Rotate one full revolution during the inspection.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":51,"n":"Do the OEM recommended transmission maintenance as applicable. Refer to Power Train, InTouch 4769766.","o":[],"swi":0,"c":"","d":[["573","SL4"],["573","SL3"],["870","SL4"],["870","SL3"],["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"]],"g":"SL1/3/4"},{"s":51,"n":"Examine the condition of the pump rate proximity switches, the cables, and the connections; make sure that the gap is in manufacturer specifications. Sensing range 3mm \u00b1 10 %.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":51,"n":"Make sure that the wiring harness is correctly routed, not damaged, loose, or frayed.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":51,"n":"Examine the condition of the TCM, wiring and the connectors for all the transmissions sensors. Make sure that they operate correctly and are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":51,"n":"Make sure that the electrical connection to the transmission shift valves is sealed.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":52,"n":"Examine the condition of the electrical connections and the cables (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Make sure the grounding inside the battery box connected to the chassis and connection is tight. Examine the condition of the cable.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":53,"n":"Battery box: Make sure that the box is in good condition, no damage or dent, no sign of water ingress, no moisture, dust, or corrosion and no unauthorise modification.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Make sure that the battery Disconnect Switches are in good condition, the connections are secured and operation is correct and able to isolate the power. Examine for corrosion.","o":[],"swi":0,"c":"","d":[["577","SL3"],["376/377","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the wiring to the battery, battery terminals and busbar are tight and no short. Make sure the 12/24V and ground are on the correct posts.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine if battery is clean and dry. Examine the battery terminal for corrosion or deposits. Clean the batteries with the mixture of the baking soda and clean warm water.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the battery cradle, lid with mat and hold in position.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the condition of equalizer and diode inside the battery box. Follow the Standard Practice: Diode measurement, InTouch 6959281.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the condition of the Starting Relays, Fuses and breakers inside the battery box, the connections are secured and operation is correct","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Do a Battery Swap Switch function test by operating the switches one at a time and verify that either battery can supply power to both sides.","o":[],"swi":0,"c":"","d":[["376/377","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the battery voltage when engine is off. Battery voltage should be 12.4 V for 12V system or 24.8V for 24V system.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the battery voltage when alternator is charging. Alternator output voltage should be between 12.4 and 13.8 V.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the battery voltage when alternator is charging. Alternator output voltage should be between 24.8 and 27V.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the condition of cable inside the box for signs of burn marks.","o":[],"swi":0,"c":"","d":[["870","SL4"],["376/377","SL4"],["577","SL4"],["573","SL4"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the date at which the battery was last replaced. Replace at 2-year intervals or if it fails the last tests.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["573","SL4"],["870","SL4"],["577","SL4"]],"g":"SL1/3/4"},{"s":53,"n":"Do the battery load test (see TLM Competency Element: Starting and Charging, InTouch 6771695). If it fails the load test or if the battery is already two years old, replace the battery.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["577","SL4"],["573","SL3"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":53,"n":"Do a load test; examine the condition of the battery cables, the glands, and the isolators. Use the battery load tester from the ACP tools.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Do the battery load test. If it fails the load test or if the battery is already two years old, replace the battery. See TLM Competency Element: Starting and Charging, InTouch 6771695.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["573","SL4"]],"g":"SL1/3/4"},{"s":53,"n":"Power box: Make sure that the box are in good condition, no damage or dent, no sign of water ingress, no moisture, dust, or corrosion and no unauthorise modification. Replace the desiccant packs if necessary.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Power box: Examine the wiring inside the box are tight, no short and route properly. Examine the wires condition for burn mark, open insulation.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Power box: Examine the condition of the Relays, Fuses and breakers inside the box, the connections are secured and operation is correct.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Power box: Make sure that all the relays are secured, not loose.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Power box: Check diode for the relays, follow the Standard Practice: Diode measurement, InTouch 6959281.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"For electric driven starter, examine the electrical terminals for corrosion or dirt. Make sure all electrical connections are securely tightened.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"For Electric driven starter, start engine to crank and observe for abnormal starting due to weak battery. (if applicable).","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":53,"n":"Examine the electrical terminals of the alternator for corrosion or dirt. Make sure all electrical connections are securely tightened.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"DCU & IO box: Make sure that the box are in good condition, no damage or dent, no sign of water ingress, no moisture, dust, or corrosion and no unauthorise modification. Tighten all the strain reliefs. Replace the desiccant packs if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"DCU & IO box: Make sure that all the terminals are tight, and the wires are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"DCU & IO box: Make sure that the DCU firmware are the latest. Record the version numbers.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"]],"g":"SL1/3/4"},{"s":54,"n":"DCU box (JAB): Make sure that the box are in good condition, no damage or dent, no sign of water ingress, no moisture, dust, or corrosion. Replace the desiccant packs if necessary.","o":[],"swi":0,"c":"","d":[["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"DCU box (JAB): Make sure that all the terminals are tight, and the wires are in good condition.","o":[],"swi":0,"c":"","d":[["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"DCU & PSU Boards: Make sure that all board terminal block headers (Green and Black connectors) are in good condition and correctly tighten.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"PSU Boards: Examine the condition of the DC/DC Converter inside the box. Make sure its output voltage matches the intended value.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine all pump sensors connected to DCU & IO Box. Examine the condition of all wiring, cables, connectors, and cable glands for signs of wear, damage, or looseness. Ensure each sensor functions properly and that readings are accurately displayed on the HMI without any errors or alarms.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine all switches (Proximity, Level and Presure swithces) connected to DCU & IO Box. Examine the condition of all wiring, cables, connectors, and cable glands for signs of wear, damage, or looseness. Ensure each sensor functions properly and that readings are accurately displayed on the HMI without any errors or alarms.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the condition of the knife gate feedback sensor, and make sure that it operates correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the condition of the densitometers transmitter and sensor body for any damage. Make sure there is no cement on the densitometer sensor tube. Examine the condition of all wiring, cables, terminals, connectors, and cable glands for signs of wear, damage, or looseness.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the condition of the flowmeter transmitter and sensor for any damage. Examine the condition of all wiring, cables, terminals, connectors, and cable glands for signs of wear, damage, or looseness.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the condition of the level sensors for any damage. Examine the condition of all wiring, cables, terminals, connectors, and cable glands for signs of wear, damage, or looseness.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Make sure that the Densitometer, flowmeter and level sensor configuration are the same as the design. Note: See setup configuration in CPF-377 Parts Manual, InTouch 4683916.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the electrical resistance of the Densitometers. This check is to ensure all the Inductive(Pick up coil) and Excitation coil sensor resistance value are withith the range. For Promass 83F Refer to SWI in InTouch 7952554. For Promass F300 & F500 perform Heartbeat Verification, refer to SWI in InTouch 8194723","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the condition and the electrical resistance of the DH NRD and the terminals. For Promass 83F Refer to SWI in InTouch 7952554. For Promass F300 & F500 perform Heartbeat Verification, refer to SWI in InTouch 8194723","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"PTO Box: Make sure that the box are in good condition, no damage or dent, no sign of water ingress, no moisture, dust, or corrosion. Tighten all the strain reliefs. Replace the desiccant packs if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"PTO box: Make sure that all the terminals are tight, and the wires are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"PTO box: Make sure that the relay is securely tight and in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the condition of the HMI computer (touchscreen, connectors and cables) and make sure that all cables are correctly secured.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Make sure that you have an up-to-date version of the CMTTruck Software. Note: Reference latest Software from SDC. Record the version numbers.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Make sure that all the DCUs in the acquisition screen are online.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Make sure that the normal kill and the OPSD operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Make sure that the pressure readings is plus or minus 150 psi before zeroing the sensor. If the offset more than the tolerance, send the sensor for the calibration.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Turn on touch screen and check the functioning and condition of engine coolant temperature gauge, engine oil pressure gauge and triplex pump lube pressure gauge on the screen.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"Jet and Think-up Valve fully controllable and provides feedback using HMI.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"With the engine stopped: Do a test of the air intake emergency kill and reset the latch.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":54,"n":"DCU box (JAB): Make sure that the DCU firmware are the latest. Record the version numbers.","o":[],"swi":0,"c":"","d":[["573","SL4"]],"g":"SL1/3/4"},{"s":54,"n":"Examine the age of the DCU board: If it has been in service for 10-years, retire the defective DCU board. Follow the guideline in InTouch#7917074.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"]],"g":"SL1/3/4"},{"s":54,"n":"Do an annual verification of the High Pressure Transducer. Send for calibration if the sensor fail annual verification.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["573","SL4"]],"g":"SL1/3/4"},{"s":54,"n":"Calibrate all densitometers Note: For Promass 83F, See SWI, 2-Point Density Adjustment, InTouch 7440315. For Promass 300/500, see SWI, 2-Point Density Adjustment for Endress Hauser Promass 300/500 NRD, InTouch 7978595","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"]],"g":"SL1/3/4"},{"s":54,"n":"Do the Heartbeat Verification for all the densitometer and flowmeter. Make sure that all the test passed. Refer to SWI in InTouch 8194723. Note: Applicable only for the Promag P 500 and F500 Model.","o":[],"swi":0,"c":"","d":[["573","SL4"],["376/377","SL4"],["577","SL4"]],"g":"SL1/3/4"},{"s":55,"n":"Examine the Apitech solenoid junction box, gland and wiring.","o":[],"swi":0,"c":"","d":[["573","SL3"],["870","SL3"],["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Examine all console switches for any damage, proper and secure wiring connections and no short on the contacts. Make sure each switch operates correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Examine all the lights on the console for any damage, and proper and secure wiring connections. Make sure each light operates correctly according to its function.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Examine all the devices (Throttle, Transmission Shifter, Engine Display, OPSD Display, etc) on the console for any damage, and proper and secure wiring connections. Make sure each they operate correctly according to its function.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Examine the Engine Parameter display for ECM, Transmission and active codes. Check diagnostic lamp for active code.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Tighten the valve solenoid connections behind the console. Make sure that the solenoids are in good condition and no sign of corrosion.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Disconnect and examine all the quick connectors between the power box(P1- P16). Apply dielectric grease on the connectors.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Disconnect and examine all the quick connectors for sensors throttles, shifters and engine displays. Apply dielectric grease on the connectors.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Disconnect and examine transmission TCM connector. Apply dielectric grease on the connectors and make sure it is securely connected","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Make sure all the boxes installed on console are securely mounted.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":56,"n":"Make sure all the cables inside the console are free from damage, exposed conductor and signs of burning. Make sure that the cables are properly bundled, routed and securely fastened.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":57,"n":"Examine the electrical terminals of the lamps for corrosion or dirt. Make sure all electrical connections are securely tightened.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":57,"n":"Examine the lamp cables condition for burn mark, expose conductor, no short.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":57,"n":"Make sure that all the lamps operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":57,"n":"Examine the condition of the trailer signal and lights and connection","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":57,"n":"Trailer Lighting Junction Box: Make sure that the box is in good condition, no damage, no sign of water ingress, no moisture, dust, or corrosion.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":57,"n":"Make sure that the headlights, clearance lights, turn signals, brake lights, and reverse lights operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":57,"n":"Make sure that the strobe lights, warning lights, and work lights operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":58,"n":"Examine the condition of the USB connector for pin damage, dust and corrosion.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":58,"n":"Download all prior job files and correctly archive it for retrieval when needed.","o":[],"swi":0,"c":"","d":[["577","SL3"],["376/377","SL3"]],"g":"SL1/3/4"},{"s":58,"n":"Make sure that the Martin Decker diaphragm surface is clean and free of cement.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":58,"n":"DCU (Acquisition): Make sure that there is communication with CemCAT software.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":58,"n":"Examine the condition of ECM connectors at engine side or under console for new console. Use CAT ET Computer to test the connection to the engine and able to see engine data. Note: Applicable for the unit with electronic engine.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":59,"n":"Start the unit; listen for unusual noises; examine for leaks and vibration during operation on the whole unit.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":59,"n":"Pressurize the air system from 90 to 120 psi. Examine the condition of the gauges, the hoses, and the connections. Listen for air leaks. HIGH PRESSURE HAZARD! Stay out of Line of Fire.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["870","SL3"],["870","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"]],"g":"SL1/3/4"},{"s":59,"n":"Make sure that all the air valves and the actuators operate correctly. Examine the air lines for leaks. HIGH PRESSURE HAZARD! Stay out of Line of Fire.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["870","SL3"],["870","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"]],"g":"SL1/3/4"},{"s":59,"n":"Make sure that all the butterfly valves on the unit are in good condition, can be operated easily and no leak.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":60,"n":"Make sure that the air compressor operates correctly and are in good condition. Do a buildup test to 100 psi in 5 min. Replace the purge valve/governor if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":60,"n":"Make sure that the fuel pump and breather are in good working condition and the fuel pressure is above 70 psi and no leaks or plugging.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":60,"n":"Do a function test of the winterization system and make sure that all components are heated (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":60,"n":"Make sure that the opening temperature of the engine thermostat is 71 degC [160 degF].","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":60,"n":"Set OPSD to 500 psi. Increase pressure to 500 psi to examine if OPSD trips at the set pressure, causing engine to return to idle and transmission to neutral. Do high-pressure test to make sure that it meets standards requirement.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["376/377","SL4"],["577","SL1"],["577","SL3"],["577","SL4"],["573","SL1"],["573","SL3"],["573",     row.push(c.swi?'Yes':'');body.push(row)});
   if(!list.length)body.push([{content:`No checks in CPF-${u} ${SLNAME(s)} match the current filters.`,colSpan:n}]);
   doc.autoTable({head:[headRow],body,startY:68,margin:{left:36,right:36,top:40,bottom:36},styles:{font:'helvetica',fontSize:8,cellPadding:3,valign:'top',lineColor:[211,218,224],lineWidth:.4},headStyles:{fillColor:[22,37,46],textColor:255},
    columnStyles:expAns?{0:{cellWidth:24},1:{cellWidth:300},3:{cellWidth:30}}:{0:{cellWidth:24},2:{cellWidth:36}},rowPageBreak:'avoid'})});
  const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(120);doc.text(`Page ${p} of ${pages}`,doc.internal.pageSize.getWidth()-36,doc.internal.pageSize.getHeight()-18,{align:'right'})}
  const fn=(us.length===1?`CPF-${us[0]}`:`CPF ${us.length} units`)+' '+(ls.length<=3?ls.map(SLNAME).join(' '):`${ls.length} levels`)+' checklist.pdf';
  if(dl)await dl.save({filename:fn,data:doc.output('blob')});else doc.save(fn);
  closeM();toast(`PDF saved · ${pairs.length} document${pairs.length>1?'s':''}.`)}
 catch(err){if(err&&err.code==='declined'){}else if(err&&err.code==='rate_limited')e.textContent='A save prompt is already open.';else e.textContent='Could not create the PDF'+(err&&err.code?` (${err.code}).`:'.');
  if($('#expbtn')){b.disabled=false;b.textContent='Create PDF'}}}
function baseMatch2(c,g){const ql=q.toLowerCase();return (!ql||c.n.toLowerCase().includes(ql))&&(g!==mg||fsec===''||c.s==fsec)&&(!fst||status(c)===fst)}

function review(){const open=mismatches.filter(m=>!m.done),pend=pendList(),closed=mismatches.filter(m=>m.done);
 $('#main').innerHTML=`<h2>Review queue</h2><p class="sub">Drift is where WorkRight no longer matches the master. Pending items were added or edited here and still need entering in WorkRight. Any TLM user can resolve these.</p>
 <div class="panel" style="margin-bottom:16px"><h3>Drift from last scrape (${open.length})</h3>${open.map(m=>{const c=checks[m.check];return `<div class="rq"><span class="pill drift">Drift</span><div><a href="#" onclick="openD(${c.id});return false"><b>${esc(c.n)}</b></a><div class="muted" style="font-size:14px">CPF-${m.u} ${SLNAME(m.s)} · ${m.type}${m.opt!==null?' · answer '+(m.opt+1):''}</div><div class="diff"><em>Master</em><span>${esc(m.app)}</span><em>WorkRight</em><span>${esc(m.wr)}</span></div></div><div style="display:grid;gap:6px"><button class="btn" onclick="resolve(${m.id},'Keep master, fix WorkRight')">Keep master</button><button class="btn ghost" onclick="resolve(${m.id},'Marked as fixed in WorkRight')">Fixed in WorkRight</button></div></div>`}).join('')||'<p class="muted">No open drift.</p>'}</div>
 <div class="panel" style="margin-bottom:16px"><h3>Waiting for WorkRight entry (${pend.length})</h3>${pend.slice(0,60).map(({c,r})=>`<div class="rq"><span class="pill pending">Pending</span><div><a href="#" onclick="openD(${c.id});return false"><b>${esc(c.n)}</b></a><div class="muted" style="font-size:14px">CPF-${r.u} ${SLNAME(r.s)}</div></div><button class="btn ghost" onclick="simSync(${c.id},'${r.u}','${r.s}')" title="Demo only: pretend the weekly scrape found it">Simulate scrape</button></div>`).join('')||'<p class="muted">Nothing waiting.</p>'}${pend.length>60?`<p class="muted" style="margin-top:10px">+${pend.length-60} more.</p>`:''}</div>
 ${closed.length?`<div class="panel"><h3>Resolved</h3><div class="log">${closed.map(m=>`<div>${esc(checks[m.check].n.slice(0,70))}… · CPF-${m.u} ${SLNAME(m.s)} · ${esc(m.done)}</div>`).join('')}</div></div>`:''}`}
function resolve(id,how){const m=mismatches[id];m.done=how+' · '+ME+', 17 Sep';const c=checks[m.check],r=c.rows.find(r=>r.u===m.u&&r.s===m.s);
 if(r)r.st=how.startsWith('Keep')?'pending':'synced';log(c,'Resolved drift: '+how);
 toast(how.startsWith('Keep')?'Kept master. Pending until WorkRight is fixed.':'Marked as synced.');render()}
function simSync(id,u,s){const c=checks[id],r=c.rows.find(r=>r.u===u&&r.s===s);if(r)r.st='synced';
 c.history.push({t:'2026-09-21',who:'Weekly scrape',what:`Found in CPF-${u} ${SLNAME(s)}, now synced`});toast('Scrape found it. Status is now synced.');render()}

let addType='check';
function add(){$('#main').innerHTML=`<h2>Add new</h2><p class="sub">New items are saved as pending. The weekly scrape marks them synced once they appear in WorkRight.</p>
 <div class="toolbar"><div class="seg" role="group" aria-label="What to add">${['check','unit','service level'].map(t=>`<button aria-pressed="${addType===t}" onclick="addType='${t}';add()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div><div class="panel" id="af"></div>`;
 if(addType==='check'){$('#af').innerHTML=`<div class="form"><label class="fld"><span>Which section?</span><select id="pk_g" onchange="pkSec()"><option value="SL0">SL0 check</option><option value="SL1/3/4">SL1, 3 &amp; 4 task</option></select></label>
  <label class="fld"><span>Section</span><select id="pk_s"></select></label>
  <div><button class="btn" onclick="newCheck(+$('#pk_s').value)">Continue</button></div>
  <p class="muted" style="margin:0;font-size:14px">You can also add a check straight from the matrix: use the + on any section heading.</p></div>`;pkSec()}
 else{const isU=addType==='unit';$('#af').innerHTML=`<div class="form"><label class="fld"><span>${isU?'Unit name':'Service level name'}</span><input type="text" id="nn" placeholder="${isU?'e.g. CPF-880':'e.g. SL2 (375 hours)'}"><span class="err" id="nne"></span></label>
 ${isU?`<label class="fld"><span>Copy checks from</span><select id="cp"><option value="">Start empty</option>${UNITS.map(u=>`<option>CPF-${u}</option>`).join('')}</select></label><p class="muted" style="margin:0;font-size:14px">Copying creates pending rows for every check the source unit uses, so you can review before entering them in WorkRight.</p>`:`<label class="fld"><span>Belongs to</span><select><option>New group</option><option>SL0</option></select></label><label class="fld"><span>Interval</span><input type="text" placeholder="e.g. 375 hours"></label>`}
 <div><button class="btn" onclick="saveSimple()">Add ${addType}</button></div></div>`}}
function pkSec(){const g=$('#pk_g').value;$('#pk_s').innerHTML=[...new Set(checks.filter(c=>c.g===g).map(c=>c.s))].map(s=>`<option value="${s}">${esc(sections[s].name)}</option>`).join('')}
function saveSimple(){const v=$('#nn').value.trim();if(!v){$('#nne').textContent='Enter a name first.';return}toast(`${v} added. In the full app it appears as a new column in the matrix.`);$('#nn').value=''}
render();
</script></body></html>
