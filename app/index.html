<title>CPF Master Checklist — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EDF0;--panel:#FFFFFF;--ink:#16252E;--muted:#5B6B75;--line:#D3DAE0;--steel:#0B5CAD;--steel-soft:#DCE8F5;--ok:#2E7D4F;--ok-soft:#DDF0E4;--pend:#B87A00;--pend-soft:#FBEFD2;--drift:#B3362C;--drift-soft:#F7DEDB;--empty:#F2F4F6;--cond:'Barlow Condensed','Arial Narrow',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181D;--panel:#18232A;--ink:#E4EAEE;--muted:#93A3AD;--line:#2C3A43;--steel:#6AA8EA;--steel-soft:#1B3350;--ok:#6CC28E;--ok-soft:#1C3527;--pend:#E3B13F;--pend-soft:#3A2F14;--drift:#EE7B70;--drift-soft:#3D1F1C;--empty:#1F2B33}}
:root[data-theme="dark"]{--bg:#10181D;--panel:#18232A;--ink:#E4EAEE;--muted:#93A3AD;--line:#2C3A43;--steel:#6AA8EA;--steel-soft:#1B3350;--ok:#6CC28E;--ok-soft:#1C3527;--pend:#E3B13F;--pend-soft:#3A2F14;--drift:#EE7B70;--drift-soft:#3D1F1C;--empty:#1F2B33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{background:#0A1115}}
nav h1{font-family:var(--cond);font-weight:600;font-size:22px;line-height:1.1;margin:0 8px 22px}
nav h1 small{display:block;font:400 13px Barlow;opacity:.65;margin-top:4px}
nav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:6px;color:#C9D4DA;cursor:pointer;display:flex;justify-content:space-between}
nav button:hover{background:#ffffff14;color:#fff}nav button[aria-current]{background:var(--steel);color:#fff}
nav .badge{background:#ffffff26;border-radius:10px;padding:0 7px;font-size:13px}
nav .foot{margin-top:auto;font-size:12px;opacity:.55;padding:0 8px}
main{padding:24px 28px;min-width:0}
h2{font-family:var(--cond);font-weight:600;font-size:30px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat b{display:block;font-family:var(--cond);font-size:34px;font-weight:600;line-height:1}
.stat span{color:var(--muted);font-size:14px}
.stat.ok b{color:var(--ok)}.stat.pend b{color:var(--pend)}.stat.drift b{color:var(--drift)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
h3{font-family:var(--cond);font-weight:600;font-size:19px;margin:0 0 12px}
.bar{display:grid;grid-template-columns:90px 1fr 48px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.track{height:10px;background:var(--empty);border-radius:5px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.synced{background:var(--ok-soft);color:var(--ok)}.pill.pending{background:var(--pend-soft);color:var(--pend)}.pill.drift{background:var(--drift-soft);color:var(--drift)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--steel);color:#fff}
input[type=search],select,input[type=text],textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
input[type=search]{min-width:240px;flex:1;max-width:380px}
.btn{background:var(--steel);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--steel);border:1px solid var(--steel)}
.btn:disabled{opacity:.45;cursor:default}
.mwrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.m{border-collapse:separate;border-spacing:0;font-size:14px;width:100%}
table.m th{position:sticky;top:0;background:var(--panel);z-index:2;font-family:var(--cond);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.m thead tr:nth-child(2) th{top:31px;font-weight:500;font-size:13px;color:var(--muted)}
table.m th.u{border-left:1px solid var(--line)}
table.m td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:center}
table.m td.name{text-align:left;padding:6px 12px;min-width:300px;max-width:440px;position:sticky;left:0;background:var(--panel);z-index:1}
table.m th.name{left:0;z-index:3;text-align:left;padding-left:12px}
table.m tr.sec td{background:var(--steel-soft);font-family:var(--cond);font-weight:600;text-align:left;padding:5px 12px;position:sticky;left:0}
table.m tbody tr.row{cursor:pointer}table.m tbody tr.row:hover td{background:var(--steel-soft)}
td.gl{border-left:1px solid var(--line)}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle}
.dot.synced{background:var(--ok)}.dot.pending{background:var(--pend)}.dot.drift{background:var(--drift)}.dot.none{background:var(--empty)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.drawer-bg{position:fixed;inset:0;background:#0008;display:none;z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);overflow:auto;padding:22px;z-index:11;transform:translateX(100%);transition:transform .22s}
.open .drawer-bg{display:block}.open .drawer{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .panel{margin-bottom:12px}
.x{float:right;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:8px}
.meta span{background:var(--empty);border-radius:5px;padding:1px 8px}
table.use{border-collapse:collapse;font-size:13px;width:100%}
table.use th{font-family:var(--cond);font-weight:500;color:var(--muted);padding:4px}
table.use td{text-align:center;padding:5px;border-top:1px solid var(--line)}
table.use td:first-child{text-align:left;font-weight:500}
table.use td button{background:none;border:1px dashed var(--line);border-radius:4px;width:22px;height:22px;cursor:pointer;color:var(--muted);padding:0;line-height:1}
table.use td button:hover{border-color:var(--steel);color:var(--steel)}
table.opt{border-collapse:collapse;width:100%;font-size:14px}
table.opt td,table.opt th{padding:6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.opt th{border-top:0;font-family:var(--cond);font-weight:500;color:var(--muted)}
.impact li{margin:4px 0}.muted{color:var(--muted)}
.log{font-size:14px}.log div{padding:6px 0;border-top:1px solid var(--line)}
.rq{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
.diff{font-size:14px;margin-top:6px;display:grid;grid-template-columns:110px 1fr;gap:2px 10px}
.diff em{font-style:normal;color:var(--muted)}
.form{display:grid;gap:14px;max-width:760px}.form label{display:grid;gap:4px;font-weight:500}
.assign{border-collapse:collapse;font-size:14px}.assign th,.assign td{padding:6px 8px;text-align:center}.assign th{font-family:var(--cond);font-weight:500;color:var(--muted)}.assign td:first-child{text-align:left;font-weight:500}
.warn{background:var(--pend-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:20}
.err{color:var(--drift);font-size:13px}
@media (max-width:820px){.toolbar select,.toolbar input[type=search]{max-width:100%;min-width:0;flex:1 1 100%;width:100%}.toolbar .seg{width:100%}.toolbar .seg button{flex:1}.flabel{min-width:0;width:100%}.detin{max-width:calc(100vw - 60px)}
.app{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;padding:10px}nav h1,nav .foot{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}main{padding:16px}}
.filters{margin-bottom:12px;padding:12px 14px;display:grid;gap:8px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flabel{font-family:var(--cond);font-weight:600;min-width:104px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--steel);border-color:var(--steel);color:#fff}
.tick{display:flex;gap:6px;align-items:center;font-size:14px;margin-left:8px}
.linkbtn{background:none;border:0;color:var(--steel);cursor:pointer;text-decoration:underline}
.fsum{font-size:14px;color:var(--muted)}.fsum b{color:var(--ink)}
.ucount{font-size:13px;color:var(--muted)}.ucount.full{color:var(--ink);font-weight:500}
select:disabled{opacity:.5}
.mwrap{max-height:calc(100vh - 300px)}
.hbtn{background:none;border:0;padding:2px 4px;font:inherit;color:inherit;cursor:pointer;border-radius:4px}.hbtn:hover{background:var(--steel-soft);color:var(--steel)}
.exp{margin-bottom:12px;padding:12px 14px}

tr.sec td{display:flex;justify-content:space-between;align-items:center;gap:8px}
.addbtn{background:none;border:1px solid var(--steel);color:var(--steel);border-radius:6px;width:24px;height:24px;line-height:1;font-size:17px;cursor:pointer;padding:0;flex:none}
.addbtn:hover{background:var(--steel);color:#fff}
.nm{display:flex;gap:5px;align-items:flex-start}
.caret{color:var(--muted);font-size:10px;line-height:1.9;flex:none}
table.m tr.det td{position:sticky;left:0}
.detin{max-width:min(940px,calc(100vw - 300px))}
table.m tbody tr.row.on td{background:var(--steel-soft)}
table.m tr.det td{text-align:left;background:var(--steel-soft);padding:0}
.detin{padding:10px 14px;display:grid;gap:8px}
.detfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.answers{display:flex;flex-wrap:wrap;gap:6px}
.ans{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:13px}
.ans i{width:9px;height:9px;border-radius:50%;flex:none}
.ans.good i{background:var(--ok)}.ans.bad i{background:var(--drift)}
.ans.good{border-color:var(--ok)}.ans.bad{border-color:var(--drift)}
.btn.sm{padding:4px 10px;font-size:13px}
.tick2{width:22px;height:22px;border-radius:5px;cursor:pointer;padding:0;border:1px solid var(--line);background:var(--empty)}
.tick2.off:hover{border-color:var(--steel);background:var(--steel-soft)}
.tick2.synced{background:var(--ok);border-color:var(--ok)}
.tick2.pending{background:var(--pend);border-color:var(--pend)}
.tick2.drift{background:var(--drift);border-color:var(--drift)}
.fld{display:grid;gap:4px;font-weight:500;margin-top:10px}
.fld input,.fld textarea,.fld select{font-weight:400;width:100%}
.oline{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.oline input[type=text]{flex:1;min-width:0}
.seg.sm button{padding:4px 9px;font-size:13px}
.del{background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--muted);flex:none;padding:0}
.del:hover{border-color:var(--drift);color:var(--drift)}
details.panel summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary h3{margin:0}
details.panel summary::before{content:'\25B8';color:var(--muted);font-size:11px}
details.panel[open] summary::before{content:'\25BE'}
details.panel[open] summary{margin-bottom:12px}
#modal{display:none}#modal.open{display:block}
.modal-bg{position:fixed;inset:0;background:#0009;z-index:30}
.mbox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(520px,92vw);max-height:86vh;overflow:auto;z-index:31}
.mbox.wide{width:min(720px,94vw)}
.mbox .form{gap:12px}
.form label.tick,label.tick{display:flex;align-items:center;gap:7px;font-weight:400;margin:0}
.form label.tick input,label.tick input{width:auto}
table.use td .tick2.off{border:1px dashed var(--line)}
table.use td .tick2{border-style:solid}
</style></head><body>

are up-to-date. Note: Wheel vibration, wobble, or noise could indicate a problem with wheel bearing.","o":[],"swi":0,"c":"IMPORTED - WorkRight General v10 - step 1.5","d":[["376/377","SL4"],["376/377","SL1"],["376/377","SL3"],["577","SL3"],["577","SL1"],["577","SL4"],["573","SL1"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"],["870","SL1"]],"g":"SL1/3/4"},{"s":23,"n":"Calculate the number of the consumables, the spare parts, and the tools necessary for the unit; make sure that sufficient number is available.","o":[],"swi":0,"c":"IMPORTED - WorkRight General v10 - step 1.6","d":[["376/377","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":24,"n":"Make sure that the guards and the shields are in position and secured.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":25,"n":"Make sure that the work related to the OEM Maintenance schedules is completed for all the major components of the unit, refer to unit Maintenance & Vendor Manual for more details.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":25,"n":"Lubricate the drivelines U-joints, slip joints, the knife gates, and the valves.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":25,"n":"Make sure that the critical bolts on the unit that are prone to become loose due to vibration is tight. For example: Make sure that the tightness of bolts such as Engine/Motor Mount bolts, Transmission Mount Bolts, PTO bolts, right angle gear box bolts, driveline bolts, tie rod bolts connecting triplex power end & fluid end, tire mounting bolts etc. Use visual paint marks to show the change in position. Note: See Section 8, CPS-679 Remote Control Cementing Pumper Skid Technical Manual, InTouch 5657509, for Standard Bolt Torque Specification.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":25,"n":"Replace all the belts and adjust to the correct tension (including the belts for the alternator and the engine, the compressor, the radiator, the transmission, and the coolant pump). Refer to InTouch 7031210 for more details.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":25,"n":"After the unit is at the operating temperature, get samples of each type of oil used in the major components of the unit. This includes the engine oil, power end oil, chain case oil (if applicable) & hydraulic oil. Use hand-held oil check device (PN 101529532 or PN 104795250) to analyze these samples. If the results show that the oil is in good condition: continue using the oil. If the results show that the oil is in bad condition: a) Send it to third-party lab for detailed analysis of the oil condition. b) Do the recommended corrective action. c) Use the OEM recommended oil and fill up to the correct level. Analyze the samples of the coolant by sending to the third-party lab. If results show that coolant is in good condition: continue using coolant If the results are bad: a) Do the recommended corrective action. b) Use the CAT ELC (see InTouch 7627486 - Must Do MB 1723) and fill up to the correct level. Note: No action is required for the Transmission oil.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"]],"g":"SL1/3/4"},{"s":25,"n":"Replace all the filters that are installed in the unit. Note: No action is required for the transmission filter.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"]],"g":"SL1/3/4"},{"s":25,"n":"Make sure that the paint is in good condition with no peeling, uneven spots, rust or cement.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":25,"n":"Tighten all the bolts and nuts to the necessary torque; use visual-paint marks to show a change in position. Refer to Section 8 of Standard Bolt Torque Specification, InTouch 7263021.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":25,"n":"After the unit is at the operating temperature, get samples of each type of oil used in the major components of the unit. This includes the engine oil, transmission oil, power end oil, chain case oil (if applicable) and hydraulic oil. Send these samples to the third-party lab for detailed analysis of the oil condition and examine the condition of other internal components that may need some action. - If the lab results show that the oil is in good condition: continue using the oil. - If the results shows that the oil is in bad condition: a) Do the recommended corrective action. b) Use the OEM recommended oil and fill up to the correct level. Note: If quick results are needed to decide whether oil needs to be changed, then you may use hand-held oil check device (PN 101529532 or PN 104795250). Hand-held oil check device is not a replacement for lab analysis. Hence, continue to send samples to lab for detailed analysis every SL4.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":25,"n":"After the unit is at the operating temperature, get samples of coolant. Analyze the samples of the coolant by sending to third-party lab. - If the lab results show that the coolant is in good condition: continue using the coolant. - If the results shows that the coolant is in bad condition: a) Do the recommended corrective action. b) Use the CAT ELC and fill up to the correct level. Note: It is mandatory to use CAT ELC (Extended Life Coolant) or Commercial coolant that meets the Caterpillar EC-1 requirements (see InTouch 7627486 - Must Do MB 1723).","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":25,"n":"After the unit is at the operating temperature, get samples of each type of oil used in the major components of the unit. This includes the engine oil, transmission oil, power end oil, chain case oil (if applicable) and hydraulic oil. Use hand-held oil check device (PN 101529532 or PN 104795250) to analyze these samples. - If the results show that the oil is in good condition: continue using the oil. - If the results shows that the oil is in bad condition: a) Send it to third-party lab for detailed analysis of the oil condition. b) Do the recommended corrective action. c) Use the OEM recommended oil and fill up to the correct level. Analyze the samples of the coolant by sending to the third-party lab. - If the results show that the coolant is in good condition: continue using the coolant. - If the results are bad: a) Do the recommended corrective action. b) Use the CAT ELC (see InTouch 7627486 - Must Do MB 1723) and fill up to the correct level.","o":[],"swi":0,"c":"","d":[["870","SL3"],["870","SL1"]],"g":"SL1/3/4"},{"s":25,"n":"Examine the condition of the air filter on the unit. Replace them if needed.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["577","SL1"],["573","SL1"],["870","SL1"]],"g":"SL1/3/4"},{"s":25,"n":"Replace all the filters that are installed in the unit.","o":[],"swi":0,"c":"","d":[["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":25,"n":"Examine the hydraulic hoses, the pneumatic hoses, fuel hoses, dry cement and cement slurry suction and delivery hoses and the fittings for damage, cracks, or cuts, rubbing or any contacts with sharp edges, hot surface, rotating shafts or moving parts; a fitting that slips on the hose; a fitting that has cracks, damage, or too much corrosion; a hose or a fitting that leaks; a hose that is hard, stiff, heat-cracked, or charred; a hose that is kinked, crushed, flattened, or twisted; a cover that is abraded so the reinforcement is visible; a cover that is blistered, soft, degraded, or loose. If you find one of these conditions, shut down the operation immediately and replace the hose assembly. See InTouch 4348815 for the section on hydraulic hoses inspection.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":26,"n":"Make sure that the air tank, the dryer, and the lubricator are installed correctly and securely.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":26,"n":"Drain water from the air tank, close valve properly and ensure there is no air leak. Examine the condition of the air tanks and the drain; make sure that the certification is tagged.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":26,"n":"Examine the condition of the lubricator oil in sight glass and ensure its level is correct. Drain water from the lubricator, close the lubricator properly and ensure there is no air leak.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["870","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":26,"n":"Engage the relief valves manually to make sure that the valves operate correctly with the correct rating of 150 psi.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":26,"n":"Examine the condition of the air tank relief valve. Replace if necessary, as specified in WS QHSE Standard 04.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":26,"n":"Calibrate or replace (if needed) the PRV and pressure gauge on the air tank.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":26,"n":"Replace relief valve (pop off on compressor) if the pop off valve is leaking.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":26,"n":"Rebuild or replace compressor purge valve assembly on air dryer.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":26,"n":"Examine the condition of the air governor valve on compressor. Replace if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":26,"n":"Replace air dryer catridge assembly (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":27,"n":"Make sure that fuel system primary and the secondary filters (tertiary if applicable), fuel-water separator filter are replaced.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":27,"n":"Drain the water from the diesel tank and the fuel filter bowls.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":27,"n":"Examine the condition of the tank breathers, the caps, the hoses, level gauge (if applicable) and the equalizing line. Make sure that the unit is installed with the equalizing line. Make sure that the tank is connected and mounted correctly, and the tank cap stays in position.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":27,"n":"Make sure that the fuel tank vent line is not plugged, stay in position and in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":27,"n":"Drain the fuel tank. Clean the tank with clean pressurized air. Refill with clean fuel. Take preventive and corrective action for water or debris that enters the system.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Do in-frame rebuild and major overhaul as required (based on engine running hrs, condition or HHP results).","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["376/377","SL3"],["573","SL4"],["573","SL3"],["870","SL4"],["870","SL3"],["577","SL3"],["577","SL4"]],"g":"SL1/3/4"},{"s":28,"n":"Examine the condition and tightness of the belts. Replace, if the belt condition is bad.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["577","SL1"],["573","SL1"],["870","SL1"]],"g":"SL1/3/4"},{"s":28,"n":"Do the OEM recommended engine maintenance (if applicable). Refer to Power Train, InTouch 4769766.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["376/377","SL3"],["573","SL4"],["573","SL3"],["577","SL3"],["577","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":28,"n":"Examine the condition of the engine air cleaner filter. Change the filter if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Replace the engine oil filter.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Examine the engine for oil leaks and air leaks.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Examine the engine air intake piping for loose bolts and clamps. Examine the charge air cooler for damage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Examine exhaust systems, engine connections, joints, muffler and insulation.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Make sure that the engine compartment door operates correctly and are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Replace all the belts (Alternator and engine) and adjust to the correct tension. See InTouch 7031210 for more details.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Examine the belt tensioner pulley for too much movement. Examine the condition of the drive and idler pulleys.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Clean the crank case breather filter assembly. Replace if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":28,"n":"Examine the external surfaces of exhaust systems for damage or stress. Examine the pipework and the joints for leaks. Use borescope to make sure that the internal surfaces are clean. Use the inlet and outlet ports to do an internal visual examination","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":28,"n":"Examine the engine starters and connections; make sure that the starter is in good condition, drive pinon is not damaged and the connections are corrosion free. Rotate one full revolution during the inspection.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":28,"n":"Do inspection of the grounding stud and clean/tighten as needed.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":28,"n":"Remove and do a servicing of the starter motor air relay turbo valve. Disassemble, clean, and replace the O-rings.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":28,"n":"Remove the alternator, do a servicing or replace the alternator if necessary. Check the output charging after you reinstall the alternator.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":28,"n":"Do the injector solenoid test. Note: See CAT C11_C13_C15 and C18 Industrial Engines troubleshooting, pg. 90, \u2018Injector Solenoid-Test\u201d, InTouch 5824317.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Do STD-04 inspection. Calibrate or replace (if needed) all the certified components on the unit, example: gauges, PRV's, sensors, fire extinguisher and others. Do annual test and make sure that the test tag is in position.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Examine the due date of STD-23 inspection and perform as needed. Make sure that the certification for the high-pressure piping is valid. Keep a record of the STD-23 certification for the 2-in 1502 high-pressure discharge manifold components. Select the date for the next certification. Refer to WS QHSE Standard 23: Testing and Inspection of Treating Equipment, InTouch 3313701.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Do the local regulatory annual inspections (example: US DOT and others).","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Do an annual kingpin inspection.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Make sure that the government regulatory reflectors/reflector tape are in position, operate correctly, and are not broken or covered.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Make sure that the government regulatory (for example, DOT) annual inspection is completed for the unit. Record the government regulatory (USDOT) number of the unit.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Make sure that the license tag/plate lights operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Make sure that the wheel chock blocks are available and in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Make sure that the first aid kit is available, in good condition, and sufficiently stocked. Replace the items as needed. Replace the items that will expire within the next year.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Examine the condition of the eye wash bottle. Make sure that it is not expired or will expire in the next year.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["870","SL4"],["577","SL4"],["573","SL4"]],"g":"SL1/3/4"},{"s":29,"n":"Make sure the ladders, handrails, safety gates are in good conditions and secured.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":30,"n":"Make sure that the coolant pH is correct. For example: for the 50/50 ratio, the pH must be 8.3.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Lubricate the cooling fan as necessary. If there is a grease zerk: Lubricate the fan hub bearing. Note: It is not necessary to lubricate all the hubs. Do not lubricate if it is a sealed bearing.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Examine the fan and the clutch for too much movement. Examine fan hub and fan blade condition. Make sure that the fan hub bolts are properly tightened. Remove and replace if the bolts if not are 10.9 grade.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Examine the fan blades for cracks and examine near the center hub for damage and debris.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Make sure that the fan is centered in the shroud and parallel to the radiator.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Make sure that the radiator shroud is installed correctly and tighten all the bolts.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Charge the air cooler and examine the condition of the fins and the tubes.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Make sure that the oil cooler fins are in good condition. Make sure that the AMOT connections are tight and have no leaks.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Examine between the cores for dirt buildup, leakage and damage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Examine the condition of the boost pipes and the hoses. Make sure that they are mounted tightly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Examine the condition of the fan guard and the belt guard. Make sure that the fan guard has no more than \u00bd in [12.7 mm] clearance.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Examine for leakage of the engine water pump. Note: If there is leakage, you can see the coolant color stains.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Examine the condition of all the hoses and the connections.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":30,"n":"Do a pressure test of the cooling system. See the CAT SIS information for the recommended psi.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":31,"n":"If the hydraulic oil sampling report shows contamination, remove and clean the hydraulic suction tank filter. Drain and steam-clean the hydraulic tank. Add oil to the hydraulic tank to the correct level (3/4 full in sight glass).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":31,"n":"Examine the condition of the breather or the filler caps. Replace if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":31,"n":"Replace the hydraulic filters in suction, return and discharge lines (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":31,"n":"Examine the power end lube pump and DCS pump mounts are in good condition. Examine the pump mounts for cracks, and make sure that the bolts are secured.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":31,"n":"Do pressure test relief valves for maximum relief. Make sure that the relief pressure setting is correct and the PRVs are certified.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":31,"n":"Examine the hydraulic pumps, hydraulic hoses, piping, connectors, and fittings for leaks and abrasions. Make sure that no hoses rub against each another.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":31,"n":"Do hydraulic flow test on the pumps. Refer hydraulic schematics of the unit for the values expected.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":31,"n":"Examine the Apitech valve and its connection. Make sure not leak.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":31,"n":"Visually examine the condition of knife gate hydraulic pump. Examine pump spline for wear and lubricate the splines with grease.","o":[],"swi":0,"c":"","d":[["577","SL3"],["376/377","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":32,"n":"Examine the condition of the hoses, the connections, and the clamps (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":32,"n":"Examine the condition of the fuel reservoir (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":32,"n":"Replace the fuel filter (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":32,"n":"Examine the head and the tube for carbon buildup (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":32,"n":"Make sure that the summer and winter shut off valve is in correct position (if applicable).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":32,"n":"Do a leakage and function checks on the Coolant Heating circulation (if applicable). Refer to Webasto Coolant Heaters Service, Repair Manual and Parts Information, InTouch 3524719.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":33,"n":"Drain and remove moisture from the C-pump and Triplex packing lube tank. Make sure that the tank internal is clean.","o":[],"swi":0,"c":"","d":[["573","SL1"],["573","SL3"],["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":33,"n":"Make sure that the C-pump and Triplex packing lube tank are full.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":33,"n":"Make sure that the C-pump lube tank pressure is between 60 to 65 psi and the Triplex pump lube tank pressure is between 15 and 20 psi.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":33,"n":"Make sure that the C-pump oil flowrate is 6 drops/min and triplex pump oil flow rate is 20 drops/min to each plunger. Note: If it is the Groeneveld/Graco system, do not disconnect the check valve to check the C-pump lube flow.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":33,"n":"Examine the condition of lube system check valves, flow control valves, hoses and fittings related to all C-pumps and Triplex pumps.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["376/377","SL4"],["577","SL1"],["577","SL3"],["577","SL4"],["573","SL1"],["573","SL3"],["573","SL4"],["870","SL1"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":33,"n":"Make sure that the lube tank relief function, air pressure regulator and the tank gauge are working correctly, the certification is valid.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["376/377","SL4"],["577","SL1"],["577","SL3"],["577","SL4"],["573","SL1"],["573","SL3"],["573","SL4"],["870","SL1"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":34,"n":"Do the OEM recommended transmission maintenance as applicable. Refer to Power Train, InTouch 4769766.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["376/377","SL3"],["573","SL4"],["573","SL3"],["870","SL4"],["870","SL3"],["577","SL3"],["577","SL4"]],"g":"SL1/3/4"},{"s":34,"n":"Examine the condition of the transmission filter. If the filter is clogged, replace it.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"]],"g":"SL1/3/4"},{"s":34,"n":"Replace the transmission oil filter.","o":[],"swi":0,"c":"","d":[["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":34,"n":"Examine the transmission breather for damage, blockages, water, and moisture. Replace if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":34,"n":"Examine the condition of the transmission mounting and support.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":34,"n":"Tighten all the drivelines, couplers, flanges, and bolts. Examine them for too much play.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Calibrate or replace (if needed) the PRV and pressure gauge on the power end lube system.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":35,"n":"Make sure that the working pressure is stenciled in white, 1-in letters on the front of the fluid end.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":35,"n":"Make sure that the tie bolts that connect fluid end to power end are in position and tight. Use visual indicator mark to know the loosening of tie bolt.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":35,"n":"If the power end oil sampling report shows contamination, drain and steam clean power end lube tank and then fill it up with oil.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":35,"n":"Examine the power-end oil tank, side glasses, hoses and fittings for leakage.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":35,"n":"For USL only: replace the power end lubrication pumps with new pumps.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":35,"n":"Examine fluid end packing, packing nut for wear, tightness or leaks. Adjust or replace the packing and the packing nut when it is necessary. Refer to Pump Packing SWI, InTouch 8103712.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Examine power-end plunger seals and replace the power end seals when it is necessary.","o":[],"swi":0,"c":"","d":[["870","SL3"],["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Examine plunger surface for wear and ensure the end thread is in good condition. Replace the plunger when it is necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Remove the valves and seats and examine the Fluid-end internal cross bore for cracks, corrosion, and wear. Inspect complete fluid end for wear or cracks. Replace worn or damaged fluid ends.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Examine the condition of the Valves, seats, and springs, and replace if it is necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["870","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Make sure that the correct suction valve burst disc is installed and is of correct rating.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Make sure that the suction and discharge cover seals are in good condition. Replace if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Clean the triplex pump power end oil breather and the oil reservoir tank breather. Replace if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Clean the triplex pump power end suction oil filter (present in the bottom of the oil reservoir) and the check valve. Replace if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Replace the powerend oil filter element in the discharge line of PE lube pump.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Visually examine the condition of power end oil. Replace oil if it shows signs of contamination. Ensure that the powerend oil tank is full.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Drain the oil drip pan and make sure that there is no cement in the pan.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Open the fluid end suction manifold and examine for cement buildup.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":35,"n":"Examine the condition of the power end lube pump, look for leakage and damage on the splines; replace the power end lube pump if it is necessary, make sure that its flow rate and pressure are not affected.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":36,"n":"Make sure that the PTO mounts are in good condition, operates correctly and there are no air leaks and oil leaks on PTO and check its shifter for smooth engagement & disengagement.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":36,"n":"Examine the condition of the right-angle gearbox mounting, supports, and brackets (if applicable). Make sure that the vibration level is acceptable.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":36,"n":"Examine the right-angle gearbox shaft seals for oil leakage. Replace the seals if needed and make sure that you put Loctite between the metal on the seals and the housing. If a lock plate is installed, make sure that there is no play.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":36,"n":"Clean the oil eductor in the lubrication line of the right angle gear box.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":36,"n":"Examine for excessive shaft play or backlash.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":36,"n":"Examine the gear boxes and lubricate the U-joints with grease (if applicable). Refer to SWI 7534320 for correct greasing method.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":36,"n":"Examine PTO's shafts for excessive abrasion or damage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"While the engines are off, examine the condition of the pump shafts, the bearings, and the couplings. Rotate the pump by hand with PTO disengaged to feel any vibration or bearing damage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Do a complete pump inspection. Make sure that you replace the worn components, all the flanges, and the suction manifold seals annually.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":37,"n":"Lubricate the C-pump bearings and the packing. Open and rebuild C-pumps. If during this step you removed the impeller, then after reassembly of the impeller you need to ensure that the impeller profile is correct as per the direction of rotation of the C-pump. Refer to section 4.10 of SWI # 6750436 to know the correct impeller profile. Also take a picture of the installed impeller and upload it as an attachment in Maximo together with the completed SL1 checklist for records and future reference purpose.","o":[],"swi":0,"c":"","d":[["577","SL3"],["376/377","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Examine the volute and the impeller for cracks and wear. Replace when it is necessary. If during this step you removed the impeller, then after reassembly of the impeller you need to ensure that the impeller profile is correct as per the direction of rotation of the C-pump. Refer to section 4.10 of SWI, InTouch 6750436 to know the correct impeller profile. Also take a picture of the installed impeller and upload it as an attachment in Maximo together with the completed SL1 checklist for records and future reference purpose.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Examine the packing lubrication (grease or oil) reservoirs. Make sure that the grease or oil reservoir is 90% full. Add grease (Greenlube EP-0 or equivalent grease) or oil when it is necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["376/377","SL4"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":37,"n":"Make sure that the oiler flowrate is correct. Note: For the Groneveld or Graco system, do not disconnect the system to check the drip. For the air-over-oil system, the drip rate is approximately 6 to 8 drops/min.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Serva pumps and Groneveld grease system (if applicable): Examine the packing and the seals for leaks, wear, and damage. If the shut-in pressure is low, record the problem. If during this step you removed the impeller, then after reassembly of the impeller you need to ensure that the impeller profile is correct as per the direction of rotation of the C-pump. Refer to section 4.10 of SWI # 6750436 to know the correct impeller profile. Also take a picture of the installed impeller and upload it as an attachment in Maximo together with the completed SL1 checklist for records and future reference purpose.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"For the Groneveld or Graco pumps (if applicable), inspect the low and high pressure filters and replace filter element if needed.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Remove the diaphragm gauge assembly for C-pump and examine diaphragm for condition and cleanliness.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Make sure that the C-pump drain valves are not blocked with cement buildup or other debris.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["376/377","SL3"],["577","SL1"],["577","SL3"],["573","SL1"],["573","SL3"],["870","SL1"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Make sure that the pump mountings, guards, brackets, and sub-frame are not loose, worn, or cracked.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"For 2x3x11 pump (if applicable), examine the condition of the rubber coupling between the PTO and C-pump. Make sure that it is in good condition and the securing bolts are tight.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"Examine the Mix water Y-strainer for clogs.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":37,"n":"5x6 C-pump: Replace the packing, the seals, and the shaft. Examine the volute and the impeller for cracks and wear while they are disassembled. If during this step you removed the impeller, then after reassembly of the impeller you need to ensure that the impeller profile is correct as per the direction of rotation of the C-pump. Refer to section 4.10 of SWI # 6750436 to know the correct impeller profile. Also take a picture of the installed impeller and upload it as an attachment in Maximo together with the completed SL1 checklist for records and future reference purpose.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["577","SL1"],["573","SL1"],["870","SL1"]],"g":"SL1/3/4"},{"s":37,"n":"4x5 C-pumps: Replace the packing, the seals, and the shaft. Examine the volute and the impeller for cracks and wear while they are disassembled. If during this step you removed the impeller, then after reassembly of the impeller you need to ensure that the impeller profile is correct as per the direction of rotation of the C-pump. Refer to section 4.10 of SWI # 6750436 to know the correct impeller profile. Also take a picture of the installed impeller and upload it as an attachment in Maximo together with the completed SL1 checklist for records and future reference purpose.","o":[],"swi":0,"c":"","d":[["376/377","SL1"],["577","SL1"],["573","SL1"],["870","SL1"]],"g":"SL1/3/4"},{"s":37,"n":"Visually examine the condition of C-pump hydraulic pump, look for leakage and damage on the splines. Lubricate spline with grease.","o":[],"swi":0,"c":"","d":[["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":38,"n":"Clean or replace the suction strainer on the 4-in suction. Install the suction strainer if it is missing.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":38,"n":"Lubricate the butterfly valves. Make sure that they are leak free and fully operational.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":38,"n":"Examine the condition of the butterfly valve handles, the lock plates, the bolts, and the washers.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":38,"n":"Make sure that the valve actuators operate correctly, tighten the bolts and no air leakage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":38,"n":"Examine the condition of the pipping support brackets and bolts. Make sure that the process pipings are adequately supported.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":38,"n":"Make sure that there are no leaks from any of the pipings or its joints (including flanges, victaulic, weco, expansion joints etc).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":38,"n":"Use a borescope to check the internals of the piping and perform corrective action if needed. Do ultrasound inspection to examine the wall thickness of the piping. Examine the piping for corrosion, cement, wear and damage. Make sure that it meets the minimum thickness criteria as mentioned in InTouch 7261204 for dirty pipes and 7785044 for any other pipes.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":38,"n":"Make sure that expansion joints on process pipings (if applicable) are replaced. Also, make sure that the support bracket is installed at 45 degrees downwards at the correct sections.","o":[],"swi":0,"c":"","d":[["376/377","SL4"]],"g":"SL1/3/4"},{"s":39,"n":"Examine the Slurry Chief nozzle for wear. Do the SWI, Mixing System Job Ready Maintenance, Slurry Chief Mark III, InTouch 6650863.","o":[],"swi":0,"c":"","d":[["577","SL1"]],"g":"SL1/3/4"},{"s":40,"n":"Lubricate all the plug valves and the chicksan swivels. Examine the condition of the 2-in seal rings. See SWI on how to correctly grease plug valves, InTouch 6780433.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":40,"n":"Examine the bands on the iron and make sure they are valid until the next SL4.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":40,"n":"Make sure that all the treating iron brackets and mounts are whole, not broken, tight, and in position.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":40,"n":"Recertify all the treating iron components as per STD 23.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":40,"n":"Make sure that the high-pressure hose inspection is performed as specified in STD 23.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":40,"n":"Do a function test to make sure that the pressure holds and operate the plug valves for smooth functioning.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":41,"n":"Tighten all machine screws, nuts, and bolts. Examine following screws: - machine screws that attach the right-angle gear box to its mounting bracket - screws that attach the hydraulic motor adapter to the right-angle gearbox - set screws of the Lovejoy jaw couplings are tight and the jaws are completely engaged with each other.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":41,"n":"Apply a shot of grease to the two bearings and to the gear teeth.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":41,"n":"Make sure that the check valve on the CemNET feeder assembly is not damaged or blocked by cement. Examine valve water intake.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":41,"n":"Make sure the hydraulic oil is replaced.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":41,"n":"Replace the crane strap every 12 months.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":41,"n":"Examine the hydraulic filters for clogging.","o":[],"swi":0,"c":"","d":[["870","SL3"],["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the wax sprayer, the tank, and the gauge operate correctly and there is no diesel in the wax tanks.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Disassemble the knife gate and examine it for wear and damage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Dissemble the suction and the discharge hoses or the pipes to the Mark III. Examine the hoses or the pipes for damage and corrosion. Do inspection as per InTouch 6650863.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["870","SL4"],["573","SL4"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the SAS is clean. Do an ultrasonic test on the SAS to examine it internally to see if 1/3 wall thickness is eroded. Replace SAS if erosion is more than 1/3 of original wall thickness. (refer to CBK-121, Slurry Air Separator (SAS), Installation Procedures, InTouch 4556205, for details about the inspection areas).","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":42,"n":"Disassemble the knife gate and examine it for wear and damage. Do the Mixing System (ACP SL1 and SL4 Maintenance) of Slurry Chief Mark III, as per SWI InTouch 6650883.","o":[],"swi":0,"c":"","d":[["577","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Use the go-no-go gauge to check the condition of the mixing nozzle. Check slurry chief nozzle for wear (Refer to MB 1165 in maintenance manuals, InTouch 4947271 and 4683916). Make sure that the jet nozzle ID is less than 1.75 in [44.45 mm] and is not sharp.","o":[],"swi":0,"c":"","d":[["577","SL3"],["376/377","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the bowl has no pitting or wear.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the jet water line connecting pipe is not corroded.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the Duck-bill jet is in good working condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the knife gate and the mixing jets operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Lubricate the gate slide plate and make sure that the position sensor is in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the recirculation hose is of correct type and length.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Do an detailed examination and make sure that the recirculation hose is in good working condition. Make sure that there is no rubbing of the hose. Install protectors if it is necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Disconnect and inspect the recirculation hose fitting\u2019s internal bore for corrosion or evidence of washed connections. If deterioration is found, remove and replace hose.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the victaulic coupling rubber seal and bolts are torqued correctly. See Standard 23 G17. InTouch 7686431.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the Victaulic coupling are not leaking and are tight.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the condition of the hose fittings, the connections, and the quick disconnects. Tighten the hose clamps and make sure that there are no leakage from hydraulic cylinders.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine manual valves, ball valves (mixing and thinup) and recirculation valve.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the fill-up and discharge piping and valves for leakage, wear and damage.","o":[],"swi":0,"c":"","d":[["870","SL3"],["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the supply and vent lines condition. Make sure that they are clear.","o":[],"swi":0,"c":"","d":[["870","SL3"],["376/377","SL3"],["577","SL3"],["573","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Verify discharge valve operation and condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the drains operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Make sure that the SFM is clean.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the condition of the tank and the sub-frame mounting. Examine the mixing tank for damage, corrosion, and cement.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the displacement tank for damage, corrosion, and cement. Make sure that the interior of the tank is clean and free of cement buildup.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Examine the displacement tank gauge markers.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":42,"n":"Circulate the water and make sure that the densitometer shows 8.34 ppg. If the density value for clean water is not 8.34 ppg and if borescope inspection shows little cement on the tube internals, then use citric acid to soak and clean densitometer. Note: If the densitometer is fully cemented, refer to WCF Repair Cementing Densitometer NRD (Cleaning), InTouch 8001814. TOXIC, CORROSIVE, HAZARDOUS CHEMICALS! Use appropriate PPE. Avoid contact with eyes and skin.","o":[],"swi":0,"c":"","d":[["870","SL4"],["376/377","SL4"],["577","SL4"],["573","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Make sure that the platform gratings are sturdy, does not move and in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Make sure that the support gussets, platform legs, channels and brackets are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Make sure that the ladder is sturdy, legs and the weld joints are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Make sure that the air cylinders are in good working condition and the roof can be operated smoothly.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Make sure that the roof fasteners have no physical damage, no corrosion and no signs of loosening.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Rivet heads must not be deformed or cracked and the surrounding area must be free from distortion. Make sure that the rivets are free from physical damage, corrosion and signs of loosening.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Make sure that all fasteners are correctly installed and no missing.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":43,"n":"Make sure that the roof structures and roof plates have no physical, no corrosions (including the weld joints).","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Examine the tanks for hammer marks and damage, rust and pitting.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Examine the welds for cracks, rust, and other damage.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Examine the tanks for sharp dents. Make sure that the welded joints do not have sharp dents.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Make sure that the tank mounting and rubber are in position.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Examine the condition of the manway bolts.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Remove and clean the aeration pads.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Make sure that the nuts of the aeration pads are correctly tightened during reassembly.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Remove debris from the tank sump cleanout line.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Examine hopper sock and clamp for crack, no damage on threads.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Install certified PRVs and gauges. Verify that popoff valve certification is compliant: Manually operate PRV and make sure that seal area is cement free and closes properly. Replace PRV if not functioning.","o":[],"swi":0,"c":"","d":[["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Make sure that the load cell and weight gauge are securely mounted and showing correct reading and working proper. Ensure the load pin is in good condition and properly secured.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Lubricate the pivot points on surge can legs with grease.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Examine the dry cement bulk delivery hoses and air hoses are in good condition.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":44,"n":"Conduct Ultrasonic Thickness Gauging (UTG) of the surge tank and ensure that it meets the acceptance criteria Note: See the CPF-577 Surge Can 55cuft Ultrasonic Thickness Gauging Procedure, InTouch 8244514","o":[],"swi":0,"c":"","d":[["577","SL4"]],"g":"SL1/3/4"},{"s":45,"n":"Use the go-no-go gauge to examine the king pin for wear. Make sure that the plate is level. Do a MPI test on the kingpin to make sure that there is no cracks or damages.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":45,"n":"Verify if the tire manufacture date is less than 6 years from present date. If the tire is more than 6 years old, replace it.","o":[],"swi":0,"c":"","d":[["577","SL4"],["573","SL4"],["376/377","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":45,"n":"Examine the condition of the landing gear (outriggers). Make sure that the landing gear is not bent and the foot is of adequate size and having adequate reinforcements and support suitable for the operating environment and failures seen.","o":[],"swi":0,"c":"","d":[["573","SL3"],["376/377","SL3"],["577","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Examine the trailer frame, cross member and the brackets for rust, cracks, and loose connections.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Disconnect the tractor from the trailer and lubricate the plate, king pin and 5th wheel. Examine the king pin condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"King Pin / 5th wheel: Examine the fastening elements and tighten to the correct torque as per SWI 7925689, if needed. Examine the condition of the locking mechanism. Examine the jaw area for damage, missing parts, and wear. Use a test pin from each manufacturer to engage the locking mechanism. Note: The locking mechanism must operate smoothly and fit tightly around the test pin. Adjust the locking mechanism if necessary. Obey the manufacturer instructions.","o":[],"swi":0,"c":"","d":[["577","SL3"],["376/377","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the landing gear and legs operate correctly. Lubricate the landing gear if necessary. Note: For lubrication, refer InTouch content #7327245, Jost Landing Gear Operation and Maintenance Procedures or #7327268, SAF-Holland Landing Gear Documentation.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the lugs and clamps are not loose or damaged. Make sure that the indicators are in position. Reposition the indicators when it is necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that all the lug nut indicators point in the same direction. Make sure that all lug nuts are tight and torqued as specified.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the rear bumpers, the mud flaps, and the fenders are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Examine the suspension for sag, lean, cracked parts, and deflated or leaking air bags. Replace as necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the air bag leveling control valve activates and operates correctly. Replace as necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the air suspension mounting bolts are tight.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the door and the engine compartment operate correctly and are in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Measure and record the brake shoe thickness on both sides. Replace if it is less than 3/8 in (10 mm).","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Measure the brake drum thickness as recommended by the OEM.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Visually Inspect the brake drum for cracks.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Do the OEM scheduled maintenance as per BPW document \"Maintenance intervals BPW axles and suspensions\" BPW-PW 33722301e, if applicable.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["376/377","SL4"],["577","SL3"],["577","SL4"],["573","SL3"],["573","SL4"],["870","SL3"],["870","SL4"]],"g":"SL1/3/4"},{"s":45,"n":"Examine the air reservoirs, drain valves and air inlet filtration condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Examine the condition of the following: swing arm, u-bolts, trailing arms, rims, clamps, shock absorber, bushing and gland hand connections.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the hose tray has no rust and is in good condition. Make sure that the hose tray has no water and the drain holes are not blocked.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the iron securement devices on the rack is in good condition.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Examine the condition of the S-cam bushing. Lubricate if necessary.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":45,"n":"Make sure that the chock block box is in good condition and the hinges operate correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":46,"n":"Make sure that there is no damage to the cable or tail hook.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":46,"n":"Make sure that the cable is fastened tightly to the tail hook.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":46,"n":"Make sure that the winch drum mounting bolts are in position and tight.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":46,"n":"Make sure that all controls are functioning correctly.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":46,"n":"Make sure that the weight of the load can be lifted within the capability of the winch.","o":[],"swi":0,"c":"","d":[["376/377","SL4"],["577","SL4"],["573","SL4"],["870","SL4"]],"g":"SL1/3/4"},{"s":47,"n":"Examine the hub meter for cracks and damage. Make sure that the glass is clear, and the reading is visible.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Replace the wheel end/hub lubricant (oil or grease). Examine the internal parts inside hub housing, include locking rings, thrust rings, roller bearings, O-ring, spring ring and pin. Replace as needed. Meritor axles are grease lubricated and require a rebuild yearly for correct lubrication replacement. Examine your wheel end OEM requirements if your wheel end is grease lubricated.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Make sure that the axle nut and hub cap is correctly tightened to the torques as specified.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Walk around the vehicle and check the wheel-ends (such as the hubcap gaskets and wheel seal areas, and the oil-soaked brake linings) for obvious signs of lubricant leakage.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"Examine the wheel endplay and the seal for leaks. Adjust as necessary. Note: See OEM for the correct torque values and assembly procedures. Lubricate the bearings if adjustment is necessary. For Hendrickson HXL7 Wheel-end maintenance, contact Hendrickson maintenance personnel for adjustment.","o":[],"swi":0,"c":"","d":[["376/377","SL3"],["577","SL3"],["573","SL3"],["870","SL3"]],"g":"SL1/3/4"},{"s":47,"n":"With wheel still mounted on vehicle, examine the outward faces of each wheel rim (tractor and trailer) and the areas around lug nuts for out-of-service conditions (cracks or damage). Replace if out-of-servi
